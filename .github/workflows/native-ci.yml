name: Native Bayesian optimization CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/native-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core model and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<2" "scipy>=1.11,<2" "scikit-learn>=1.4,<1.7" "pytest>=8,<10"
          python -m pip check
      - name: Compile native implementation
        run: python -m compileall -q src tests
      - name: Exercise continuous, discrete and multi-fidelity decisions
        run: python -m pytest -q tests
